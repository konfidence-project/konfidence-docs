<?xml version="1.0" encoding="UTF-8"?>
<!-- Do not edit this file with editors other than draw.io -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="980px" height="105px" viewBox="0 0 980 105"
     style="background: transparent; background-color: transparent; color-scheme: light dark;">
  <defs>
    <!-- context-stroke makes the arrowhead inherit the line's stroke color -->
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3"
            orient="auto" markerUnits="userSpaceOnUse">
      <polygon points="0 0, 8 3, 0 6" fill="context-stroke"/>
    </marker>
    <style>
      .box-build    { fill: #F9FAFB; stroke: #6B7280; }
      .box-assemble { fill: #F3EEFF; stroke: #7B2FBE; }
      .box-vector   { fill: #E8F5FB; stroke: #139CC7; }
      .text-build   { fill: #374151; }
      .text-assemble { fill: #4C0E8F; }
      .text-vector  { fill: #0E7FA3; }
      .edge-gray    { stroke: #6B7280; }
      .edge-purple  { stroke: #7B2FBE; }
      .label-gray   { fill: #374151; }
      .label-purple { fill: #4C0E8F; }

      @media (prefers-color-scheme: dark) {
        .box-build    { fill: #1F2937; stroke: #9CA3AF; }
        .box-assemble { fill: #2E1065; stroke: #A78BFA; }
        .box-vector   { fill: #0C4A6E; stroke: #38BDF8; }
        .text-build   { fill: #F3F4F6; }
        .text-assemble { fill: #DDD6FE; }
        .text-vector  { fill: #BAE6FD; }
        .edge-gray    { stroke: #9CA3AF; }
        .edge-purple  { stroke: #A78BFA; }
        .label-gray   { fill: #D1D5DB; }
        .label-purple { fill: #DDD6FE; }
      }
    </style>
  </defs>

  <!-- CI pipeline — Build phase -->
  <rect x="1" y="30" width="158" height="60" rx="5" ry="5"
        class="box-build" stroke-width="2"/>
  <text x="80" y="65"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="bold" text-anchor="middle"
        class="text-build">CI pipeline</text>

  <!-- Arrow 1: CI pipeline → Artifact (Build phase gray) -->
  <text x="210" y="22"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="11" text-anchor="middle"
        class="label-gray">builds &amp; publishes</text>
  <line x1="160" y1="60" x2="257" y2="60"
        stroke-width="2" marker-end="url(#arr)" class="edge-gray"/>

  <!-- Artifact — Build phase -->
  <rect x="261" y="30" width="178" height="60" rx="5" ry="5"
        class="box-build" stroke-width="2"/>
  <text x="350" y="57"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="bold" text-anchor="middle"
        class="text-build">Artifact</text>
  <text x="350" y="75"
        font-family="Courier New,Courier,monospace"
        font-size="12" text-anchor="middle"
        class="text-build">:main (alias)</text>

  <!-- Arrow 2: Artifact → VectorTemplate (Build→Assemble, gray) -->
  <text x="490" y="22"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="11" text-anchor="middle"
        class="label-gray">alias resolved by</text>
  <line x1="440" y1="60" x2="537" y2="60"
        stroke-width="2" marker-end="url(#arr)" class="edge-gray"/>

  <!-- VectorTemplate — Assemble phase -->
  <rect x="541" y="30" width="178" height="60" rx="5" ry="5"
        class="box-assemble" stroke-width="2"/>
  <text x="630" y="65"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="bold" text-anchor="middle"
        class="text-assemble">VectorTemplate</text>

  <!-- Arrow 3: VectorTemplate → Vector (Assemble phase purple) -->
  <text x="770" y="22"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="11" text-anchor="middle"
        class="label-purple">assembles</text>
  <line x1="720" y1="60" x2="817" y2="60"
        stroke-width="2" marker-end="url(#arr)" class="edge-purple"/>

  <!-- Vector — Assign phase -->
  <rect x="821" y="30" width="158" height="60" rx="5" ry="5"
        class="box-vector" stroke-width="2"/>
  <text x="900" y="57"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="13" font-weight="bold" text-anchor="middle"
        class="text-vector">Vector</text>
  <text x="900" y="75"
        font-family="Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="12" text-anchor="middle"
        class="text-vector">immutable snapshot</text>
</svg>
