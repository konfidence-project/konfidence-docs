- name: Valid prose, resource names, and technical frontmatter
  input: |
    ---
    id: ADR-0041
    title: Configure Konfidence with VectorTemplate
    description: Configure a vector with Kubernetes and Helm.
    pageClass: adr
    status: proposed
    category: Technology Stack
    impact: High
    layout: doc
    outline: deep
    ---

    # ADR-0041: Configure Konfidence with VectorTemplate

    Use ArtifactDeployment, StageVersion, StageVersionUsage, VectorActivation,
    VectorDeployment, VectorPromotion, VectorPromotionConfig, and VectorTemplate.
    A DeploymentClass provides a capability for a DeploymentTarget.
    Use an HTTPRoute and a ConfigMap with Kubernetes.
  want: ""

- name: The six plain-language replacements preserve sentence capitalization
  input: |
    Utilize the file. Dispose of the file. Obtain the file.
    In order to continue, use the file.
    Continue due to the fact that the file exists.
    Read all files with the exception of this file.
  contains:
    - "Konfidence.PlainLanguage:Use 'Use' instead of 'Utilize'."
    - "Konfidence.PlainLanguage:Use 'Delete' instead of 'Dispose of'."
    - "Konfidence.PlainLanguage:Use 'Get' instead of 'Obtain'."
    - "Konfidence.PlainLanguage:Use 'To' instead of 'In order to'."
    - "Konfidence.PlainLanguage:Use 'because' instead of 'due to the fact that'."
    - "Konfidence.PlainLanguage:Use 'except' instead of 'with the exception of'."

