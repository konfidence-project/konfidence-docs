name: Sync CRD reference from konfidence

# Pulls the generated CRD reference (api/docs/crd.md) from the konfidence repo
# and opens (or force-updates) a single PR against this repo. konfidence is the
# source of truth; crd.md here is 100% generated, so the sync branch is owned
# unconditionally by this workflow — any divergence is reset to the latest
# fetched state (peter-evans/create-pull-request force-updates the branch).

on:
  schedule:
    # Every 6 hours, offset to :17 rather than :00
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize syncs on the shared branch: let any in-flight run finish cleanly
  # rather than cancel it mid-push (which could leave the branch/PR half-updated).
  # The queued run re-fetches the latest crd.md anyway, and is a no-op when there's
  # no drift, so waiting costs nothing and avoids racing on sync/crd-reference.
  group: sync-crd-reference
  cancel-in-progress: false

jobs:
  sync-crd-reference:
    name: Sync / CRD Reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout konfidence-docs
        uses: actions/checkout@v7

      - name: Checkout upstream CRD reference
        id: upstream
        uses: actions/checkout@v7
        with:
          repository: konfidence-project/konfidence
          ref: main
          path: .upstream
          sparse-checkout: |
            api/docs/crd.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Copy CRD reference into place
        id: copy
        run: |
          set -euo pipefail
          mkdir -p src/docs/reference
          cp .upstream/api/docs/crd.md src/docs/reference/crd.md
          rm -rf .upstream
          echo "Copied $(wc -l < src/docs/reference/crd.md) lines."
          echo "short_sha=${COMMIT::7}" >> "$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}

      - name: Open or update sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/crd-reference
          title: "docs: sync CRD reference from konfidence @ ${{ steps.copy.outputs.short_sha }}"
          commit-message: "docs(crd): pull latest crd.md from konfidence"
          body: |
            Automated sync of `src/docs/reference/crd.md` from [`konfidence-project/konfidence`](https://github.com/konfidence-project/konfidence/blob/main/api/docs/crd.md).

            This file is generated by upstream — do not edit.

            Synced from `main` HEAD @ [`${{ steps.upstream.outputs.commit }}`](https://github.com/konfidence-project/konfidence/commit/${{ steps.upstream.outputs.commit }})
          labels: |
            automated
            reference-sync

      - name: Authenticate as konfidence-bot
        if: steps.cpr.outputs.pull-request-number
        uses: konfidence-project/.github/.github/actions/github-app-auth@v4
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - name: Auto-approve sync PR
        if: steps.cpr.outputs.pull-request-number
        run: gh pr review --approve ${{ steps.cpr.outputs.pull-request-number }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --rebase ${{ steps.cpr.outputs.pull-request-number }}
