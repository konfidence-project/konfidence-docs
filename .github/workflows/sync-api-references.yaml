name: Sync API references from konfidence

# Pulls generated API references (api/docs/crd.md, api/docs/cli.md) from the
# konfidence repo and opens (or force-updates) a single PR against this repo.
# konfidence is the source of truth; these files are 100% generated, so the
# sync branch is owned unconditionally by this workflow — any divergence is
# reset to the latest fetched state (peter-evans/create-pull-request
# force-updates the branch).

on:
  schedule:
    # Every 6 hours, offset to :17 rather than :00
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Serialize syncs on the shared branch: let any in-flight run finish cleanly
  # rather than cancel it mid-push (which could leave the branch/PR half-updated).
  # The queued run re-fetches the latest refs anyway, and is a no-op when there's
  # no drift, so waiting costs nothing and avoids racing on sync/api-references.
  group: sync-api-references
  cancel-in-progress: false

jobs:
  sync-api-references:
    name: Sync / API References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout konfidence-docs
        uses: actions/checkout@v7

      - name: Checkout upstream API references
        id: upstream
        uses: actions/checkout@v7
        with:
          repository: konfidence-project/konfidence
          ref: main
          path: .upstream
          sparse-checkout: |
            api/docs/crd.md
            api/docs/cli.md
            api/docs/api.json
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Copy references into place
        id: copy
        run: |
          set -euo pipefail
          mkdir -p src/docs/reference
          cp .upstream/api/docs/crd.md src/docs/reference/crd.md
          cp .upstream/api/docs/cli.md src/docs/reference/cli.md
          cp .upstream/api/docs/api.json src/docs/reference/api.json
          rm -rf .upstream
          echo "short_sha=${COMMIT::7}" >> "$GITHUB_OUTPUT"
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}

      - name: Open or update sync PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/api-references
          base: main
          title: "docs: sync API references from konfidence @ ${{ steps.copy.outputs.short_sha }}"
          commit-message: "docs(reference): pull latest API references from konfidence"
          body: |
            Automated sync of API references from [`konfidence-project/konfidence`](https://github.com/konfidence-project/konfidence/blob/main/api/docs/).

            These files are generated by upstream — do not edit.

            - `src/docs/reference/crd.md` — CRD reference
            - `src/docs/reference/cli.md` — CLI reference

            Synced from `main` HEAD @ [`${{ steps.upstream.outputs.commit }}`](https://github.com/konfidence-project/konfidence/commit/${{ steps.upstream.outputs.commit }})
          labels: |
            automated
            reference-sync

      - name: Authenticate as konfidence-bot
        if: steps.cpr.outputs.pull-request-number
        uses: konfidence-project/.github/.github/actions/github-app-auth@v4
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.KONFIDENCE_PROJECT_REPO_ACCESS_PRIVATE_KEY }}

      - name: Auto-approve sync PR
        if: steps.cpr.outputs.pull-request-number
        run: gh pr review --approve ${{ steps.cpr.outputs.pull-request-number }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        run: gh pr merge --auto --rebase ${{ steps.cpr.outputs.pull-request-number }}
