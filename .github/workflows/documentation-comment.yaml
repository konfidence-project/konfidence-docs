name: Documentation findings summary

on:
  workflow_call:
    inputs:
      tool:
        type: string
        required: true
      result:
        type: string
        required: true
      links:
        type: string
        default: ""

jobs:
  comment:
    name: Update documentation findings
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      pull-requests: write
    # All three workflows update one comment without overwriting each other.
    concurrency:
      group: documentation-comment-${{ github.event.pull_request.number }}
      queue: max
    steps:
      # No checkout or dependency installation in the job with comment access.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TOOL: ${{ inputs.tool }}
          CHECK_RESULT: ${{ inputs.result }}
          LINK_REPORT: ${{ inputs.links }}
        with:
          script: |
            const tools = ['Vale', 'Markdownlint', 'Lychee'];
            const tool = process.env.TOOL;
            if (!tools.includes(tool)) throw new Error('Unknown documentation check.');
            const pr = context.payload.pull_request;
            const repo = context.repo;
            const fullName = repo.owner + '/' + repo.repo;
            if (!pr || pr.head.repo.full_name !== fullName || context.actor === 'dependabot[bot]') return;
            const { data: current } = await github.rest.pulls.get({ ...repo, pull_number: pr.number });
            if (current.state !== 'open' || current.head.sha !== pr.head.sha) {
              core.notice('A newer PR commit exists or the PR is closed; leave its comment unchanged.');
              return;
            }

            const marker = '<!-- konfidence-docs-maintenance -->';
            const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: pr.number, per_page: 100 });
            const previous = comments.find(item => item.user?.login === 'github-actions[bot]' && item.body?.startsWith(marker));
            let state = { sha: pr.head.sha, reports: {} };
            const saved = previous?.body.match(/<!-- maintenance-state:([A-Za-z0-9+/=]+) -->/);
            if (saved) {
              try {
                const decoded = JSON.parse(Buffer.from(saved[1], 'base64').toString('utf8'));
                if (decoded.sha === pr.head.sha && decoded.reports && typeof decoded.reports === 'object') {
                  for (const name of tools) {
                    const report = decoded.reports[name];
                    if (report && typeof report.body === 'string' && report.body.length <= 6000 && Number.isSafeInteger(report.runId) && Number.isSafeInteger(report.attempt)) {
                      state.reports[name] = report;
                    }
                  }
                }
              } catch { /* Replace an unreadable saved summary. */ }
            }
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT || 1);
            const prior = state.reports[tool];
            if (prior && (prior.runId > context.runId || (prior.runId === context.runId && prior.attempt > attempt))) return;

            const runUrl = context.serverUrl + '/' + fullName + '/actions/runs/' + context.runId;
            const escape = value => String(value ?? '').slice(0, 700).replace(/[&<>|\x60\[\]@\\*\r\n]/g, char => '&#' + char.charCodeAt(0) + ';');
            const source = finding => {
              const file = String(finding.path || '');
              if (!file || file.length > 512 || file.startsWith('/') || file.split('/').includes('..')) return '[Full report](' + runUrl + ')';
              const line = Number.isInteger(finding.line) && finding.line > 0 ? '#L' + finding.line : '';
              const encoded = file.split('/').map(part => encodeURIComponent(part).replace(/[!'()*]/g, char => '%' + char.charCodeAt(0).toString(16))).join('/');
              const url = context.serverUrl + '/' + fullName + '/blob/' + context.sha + '/' + encoded + line;
              return '[' + escape(file) + (line ? ':' + finding.line : '') + '](' + url + ')';
            };

            let findings = [];
            let total = 0;
            let complete = true;
            if (tool === 'Lychee') {
              const report = JSON.parse(process.env.LINK_REPORT || '{}');
              const scoped = report.scope === 'pull_request';
              complete = report.complete === true && scoped;
              findings = scoped && Array.isArray(report.findings) ? report.findings : [];
              total = scoped ? Number(report.total) || 0 : 0;
            } else {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...repo, run_id: context.runId, filter: 'latest', per_page: 100 });
              const job = jobs.find(item => item.name === tool);
              if (!job?.check_run_url) throw new Error('Could not find the ' + tool + ' check.');
              const checkId = Number(job.check_run_url.split('/').pop());
              const annotations = await github.paginate(github.rest.checks.listAnnotations, { ...repo, check_run_id: checkId, per_page: 100 });
              findings = annotations.filter(item => ['warning', 'failure'].includes(item.annotation_level) && item.message.startsWith('[' + tool.toLowerCase() + ']')).map(item => ({
                path: item.path,
                line: item.start_line,
                message: item.message.split('\n\nRaw Output:')[0].replace(/^\[[^\]]+\] reported by reviewdog[^\n]*\n/, '')
              }));
              total = findings.length;
            }

            let section = '### ' + tool + '\n\n';
            if (process.env.CHECK_RESULT !== 'success' || !complete) {
              const reason = process.env.CHECK_RESULT === 'success' ? 'report unavailable' : process.env.CHECK_RESULT;
              section += '**Check incomplete (' + escape(reason) + ').** Open the run to review setup, configuration, or test failures.\n\n';
            } else if (total === 0) {
              section += tool === 'Lychee' ? 'No link findings relevant to this PR.\n\n' : 'No reported findings on changed PR lines.\n\n';
            } else {
              section += '**' + total + (tool === 'Lychee' ? ' link finding' + (total === 1 ? '' : 's') + ' relevant to this PR' : ' reported findings on changed PR lines') + '.**\n\n';
            }
            if (findings.length) {
              section += '| Location | What to review |\n| --- | --- |\n';
              let shown = 0;
              for (const finding of findings.slice(0, 10)) {
                const target = finding.target ? ' Target: ' + escape(finding.target) + '.' : '';
                const repeated = finding.occurrences > 1 ? ' Seen ' + Number(finding.occurrences) + ' times.' : '';
                const row = '| ' + source(finding) + ' | ' + escape(finding.message) + target + repeated + ' |\n';
                if (section.length + row.length > 5500) break;
                section += row;
                shown++;
              }
              if (shown < total) section += '\nShowing ' + shown + ' of ' + total + '; open the full report for the rest.\n';
            }
            section += tool === 'Lychee'
              ? '\n[Open full website and README link report](' + runUrl + ')'
              : '\n[Open ' + tool + ' run and full report](' + runUrl + ')';
            state.reports[tool] = { runId: context.runId, attempt, body: section };
            const sections = tools.map(name => state.reports[name]?.body || '### ' + name + '\n\nWaiting for this check on the current commit.');
            const body = [
              marker,
              '## Documentation checks · ' + pr.head.sha.slice(0, 7),
              'Review the findings below; they are advisory during rollout, so checks can stay green. This comment updates as each check finishes.',
              ...sections,
              '<!-- maintenance-state:' + Buffer.from(JSON.stringify(state)).toString('base64') + ' -->'
            ].join('\n\n');
            if (body.length > 60000) throw new Error('Documentation summary exceeds the comment limit.');
            if (previous) await github.rest.issues.updateComment({ ...repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body });
