StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Konfidence
# Keep Vale's default code exclusions and skip technical frontmatter values.
IgnoredScopes = code, tt, kbd, samp, text.frontmatter.id, text.frontmatter.status, text.frontmatter.pageClass, text.frontmatter.layout, text.frontmatter.outline, text.frontmatter.category, text.frontmatter.impact, text.frontmatter.date_proposed, text.frontmatter.date_approved

[*.md]
BasedOnStyles = Vale, Konfidence
# Vale.Spelling also reads spelling-only exceptions in .vale/styles/config/ignore/.
Vale = warning
# VitePress custom heading anchors are identifiers, not visible prose.
TokenIgnores = (\{\#[A-Za-z0-9_-]+\})

# These references are generated by sync-api-references.yaml. Fix their sources.
[**/reference/{crd,cli,helm-values-konfidence,helm-values-orchestrator}.md]
BasedOnStyles = NONE
