# Check the HTML VitePress produces, including the site's actual heading IDs.
include_fragments = "anchor-only"
index_files = ["index.html"]
fallback_extensions = ["html"]

# The build is inside a hidden directory and is excluded by .gitignore.
hidden = true
no_ignore = true
no_progress = true

# Local dashboards and private addresses in examples are not public targets.
exclude_all_private = true

# These exact pages are available to readers but return HTTP 403 in CI.
# Verified on 2026-11-12. Recheck them manually when reviewing link exceptions.
# Keep other pages on these hosts checked; do not accept HTTP 403 globally.
exclude = [
  '^https://www\.sap\.com/about/legal/impressum-se\.html$',
  '^https://www\.merriam-webster\.com/$',
  '^https://ryandeangraham\.medium\.com/istio-gateway-api-nodeport-c598a21c4c95$',
]

# Be considerate of external sites; keep failures visible for review.
max_concurrency = 8
host_concurrency = 2
host_request_interval = "200ms"
max_retries = 2
timeout = 20
max_cache_age = "1d"
cache_exclude_status = "400..=599"
